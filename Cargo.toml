[package]
name = "cargo-clean-targets"
version = "0.1.3"
edition = "2021"
rust-version = "1.74"
description = "Cargo subcommand: strip target/ caches across a tree, keep only compiled binaries"
authors = ["François-Guillaume Ribreau <fg@france-nuage.fr>"]
license = "MIT"
repository = "https://github.com/FGRibreau/cargo-clean-targets"
homepage = "https://github.com/FGRibreau/cargo-clean-targets"
documentation = "https://github.com/FGRibreau/cargo-clean-targets#readme"
readme = "README.md"
keywords = ["cargo", "cleanup", "disk", "cache", "cli"]
categories = ["command-line-utilities", "development-tools::cargo-plugins"]
exclude = [".github/*", "release-plz.toml"]

[[bin]]
name = "cargo-clean-targets"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
